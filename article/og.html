<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Link preview card (Facebook, forum, Mastodon), 1200 x 630: the article's header and hero, the map cropped shorter.
     Render with: node scripts/og-image.mjs -> article/img/og.jpg
     Map box 1128 x 404 shows hero-komoot.png (1600 x 900) at scale 0.705, cropped 115 px from the top.
     Road in the image: x = 400 + 0.8778 y, so pins and the tick below sit on it (asphalt ends at the image centre, as in the article). -->
<style>
  :root { --ink: #2b2620; --muted: #6f665b; --paper: #faf8f4; --line: #e4ded4; --asphalt: #3a3a3a; --gravel: #b07a3c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 26px 36px 0; position: relative; }
  .kicker { font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  h1 { font: 700 76px/1 Georgia, "Times New Roman", serif; margin: 0; letter-spacing: -.01em; }
  .sub { font: italic 34px/1.2 Georgia, serif; color: var(--muted); margin: 4px 0 0; }
  .hero { position: absolute; left: 36px; top: 196px; width: 1128px; height: 404px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  .hero > img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .leaders { position: absolute; inset: 0; }
  .leaders line { stroke-width: 2.5; }
  .pin { position: absolute; transform: translate(-50%, -50%); width: 38px; height: 38px; border-radius: 50%; border: 3px solid #fff;
         box-shadow: 0 2px 6px rgba(0,0,0,.35); color: #fff; display: grid; place-items: center; font: 700 18px system-ui, sans-serif; }
  .a { background: var(--asphalt); } .b { background: var(--gravel); }
  .pin.a { left: 437px; top: 62px; } .pin.b { left: 683px; top: 342px; }
  .tick { position: absolute; left: 564px; top: 202px; width: 34px; height: 5px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px #fff;
          transform: translate(-50%, -50%) rotate(-41.3deg); }
  .end { position: absolute; left: 564px; top: 202px; transform: translate(calc(-100% - 26px), -50%); font-size: 18px; font-weight: 600;
         background: rgba(255,255,255,.94); border-radius: 5px; padding: 3px 10px; white-space: nowrap; }
  .photo { position: absolute; width: 300px; height: 225px; border-radius: 9px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo.pa { left: 40px; top: 160px; } .photo.pb { left: 790px; top: 22px; }
  .tag { position: absolute; left: 9px; top: 9px; display: flex; gap: 8px; align-items: center; background: rgba(255,255,255,.94);
         border-radius: 999px; padding: 3px 13px 3px 3px; font-weight: 600; font-size: 19px; }
  .tag i { width: 27px; height: 27px; border-radius: 50%; color: #fff; display: grid; place-items: center; font: normal 700 14px system-ui; }
  .applabel { position: absolute; right: 12px; bottom: 12px; background: rgba(255,255,255,.94); border-radius: 6px; padding: 4px 12px; font-size: 17px; color: var(--muted); }
  .applabel b { color: var(--ink); }
</style>
</head>
<body>
  <p class="kicker">A proposal for OpenStreetMap-based maps</p>
  <h1>Mind the Surface</h1>
  <p class="sub">A main road is not always paved</p>
  <div class="hero">
    <img src="img/hero-komoot.png" alt="">
    <svg class="leaders" viewBox="0 0 1128 404">
      <line x1="437" y1="62" x2="340" y2="160" stroke="#3a3a3a"/>
      <line x1="683" y1="342" x2="790" y2="247" stroke="#b07a3c"/>
    </svg>
    <span class="pin a">A</span><span class="pin b">B</span>
    <span class="tick"></span><span class="end">asphalt ends</span>
    <div class="photo pa"><img src="img/hero-paved.jpg" alt=""><span class="tag"><i class="a">A</i>Paved</span></div>
    <div class="photo pb"><img src="img/hero-unpaved.jpg" alt=""><span class="tag"><i class="b">B</i>Unpaved</span></div>
    <span class="applabel"><b>Komoot</b>, today</span>
  </div>
</body>
</html>
