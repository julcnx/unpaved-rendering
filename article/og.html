<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Link preview card (Facebook, forum, Mastodon), 1200 x 630. Render with: node scripts/og-image.mjs -> article/img/og.jpg -->
<style>
  :root { --ink: #2b2620; --muted: #6f665b; --paper: #faf8f4; --line: #e4ded4; --road: #f5c26b; --casing: #c9923a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 48px 56px 0; position: relative; }
  .kicker { font-size: 20px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  h1 { font: 700 84px/1 Georgia, "Times New Roman", serif; margin: 0; letter-spacing: -.01em; }
  .sub { font: italic 40px/1.2 Georgia, serif; color: var(--muted); margin: 10px 0 0; }
  .photos { position: absolute; left: 56px; right: 56px; top: 268px; display: flex; gap: 24px; }
  .photo { position: relative; flex: 1; height: 232px; border-radius: 12px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .chip { position: absolute; left: 12px; top: 12px; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.95); border-radius: 999px; padding: 4px 14px 4px 5px; font: 600 22px/1 system-ui, sans-serif; }
  .chip i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: 17px; }
  .a i { background: var(--ink); } .b i { background: #b07a3c; }
  /* the map line under both photos: one orange road, the same on both sides */
  .road { position: absolute; left: 0; right: 0; bottom: 54px; height: 14px; background: var(--road); border-top: 2px solid var(--casing); border-bottom: 2px solid var(--casing); }
  .note { position: absolute; left: 56px; right: 56px; bottom: 18px; display: flex; justify-content: space-between; font-size: 20px; color: var(--muted); }
  .note b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
  <p class="kicker">OpenStreetMap map styles</p>
  <h1>Mind the Surface</h1>
  <p class="sub">A main road is not always paved</p>
  <div class="photos">
    <div class="photo"><img src="img/hero-paved.jpg" alt=""><span class="chip a"><i>A</i>Paved</span></div>
    <div class="photo"><img src="img/hero-unpaved.jpg" alt=""><span class="chip b"><i>B</i>Unpaved</span></div>
  </div>
  <div class="road"></div>
  <div class="note"><span><b>On most maps: the same orange line.</b> Namibia, C48</span><span>Photos: tallguy, Mapillary, CC BY-SA 4.0</span></div>
</body>
</html>
