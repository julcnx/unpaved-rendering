<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind the Surface demo</title>
<style>
  :root { --bg: #fafaf8; --fg: #222; --muted: #666; --panel: #fff; --line: #ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18181a; --fg: #eee; --muted: #aaa; --panel: #222225; --line: #3a3a3e; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  aside { padding: 14px 16px; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .tag { color: var(--muted); margin: 0 0 12px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  select, input[type=search] { width: 100%; padding: 6px; font: inherit; }
  .row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .row label { display: inline; margin: 0; font-weight: 400; }
  #legend { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  #legend div { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  #legend canvas { width: 90px; height: 22px; border-radius: 3px; }
  #note, #status { color: var(--muted); font-size: 13px; margin-top: 8px; }
  main { position: relative; }
  #map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #attr { position: absolute; right: 0; bottom: 0; background: rgba(255,255,255,0.8); color: #333; font-size: 11px; padding: 2px 6px; }
  #attr a { color: #0645ad; }
  #msg { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(0,0,0,0.75); color: #fff; padding: 6px 12px; border-radius: 4px; display: none; }
  @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: auto 60vh; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <h1>Mind the Surface</h1>
  <p class="tag">Where can my city car go?</p>

  <label for="spot">Sample spot</label>
  <select id="spot"></select>

  <label for="search">Search anywhere</label>
  <input id="search" type="search" placeholder="Place name, then Enter">

  <label for="style">Style</label>
  <select id="style"></select>
  <div class="row"><input id="compare" type="checkbox"><label for="compare">Side by side: all styles</label></div>

  <label for="bg">Background</label>
  <select id="bg"></select>

  <div id="legend"></div>
  <div id="note"></div>
  <div id="status"></div>
</aside>
<main>
  <canvas id="map"></canvas>
  <div id="msg"></div>
  <div id="attr">© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · Terrain: AWS Terrain Tiles</div>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
