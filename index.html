<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind the Surface demo</title>
<style>
  :root { --bg: #fafaf8; --fg: #222; --muted: #666; --panel: #fff; --line: #ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18181a; --fg: #eee; --muted: #aaa; --panel: #222225; --line: #3a3a3e; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  aside { padding: 14px 16px; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .tag { color: var(--muted); margin: 0 0 12px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  select, input[type=search] { width: 100%; padding: 6px; font: inherit; }
  .row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .row label { display: inline; margin: 0; font-weight: 400; }
  #legend { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  #legend div { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  #legend canvas { width: 90px; height: 22px; border-radius: 3px; }
  #legend table.all { border-collapse: collapse; }
  #legend table.all th { font-weight: 600; color: var(--muted); text-align: center; padding: 0 0 2px; }
  #legend table.all td { padding: 2px 2px; }
  #legend table.all td:first-child { padding-right: 8px; white-space: nowrap; }
  #legend table.all canvas { width: 38px; }
  #note, #status { color: var(--muted); font-size: 13px; margin-top: 8px; }
  main { position: relative; }
  /* Absolute: the canvas takes the size of main, not its own pixel ratio (which made it taller than the window after a resize). */
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #attr { position: absolute; right: 0; bottom: 0; background: rgba(255,255,255,0.8); color: #333; font-size: 11px; padding: 2px 6px; }
  #attr a { color: #0645ad; }
  #chips { position: absolute; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 20px); }
  #bgchips { position: absolute; right: 10px; bottom: 26px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: calc(100% - 20px); }
  #bgchips button { font-weight: 500; padding: 4px 10px; font-size: 12px; }
  .chips button, #chips button { font: 600 13px system-ui, sans-serif; padding: 5px 11px; border-radius: 999px; border: 1px solid #bbb; background: rgba(255,255,255,0.92); color: #222; cursor: pointer; }
  .chips button[aria-pressed=true], #chips button[aria-pressed=true] { background: #222; color: #fff; border-color: #fff; box-shadow: 0 0 0 1px #222; } /* white ring: visible on dark maps too */
  .chips kbd, #chips kbd { font: inherit; opacity: 0.55; margin-left: 5px; }
  #msg { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); background: rgba(0,0,0,0.75); color: #fff; padding: 6px 12px; border-radius: 4px; display: none; }
  @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: auto 60vh; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
  /* embed=1: map only (iframe in the article). The shield takes the first click, so scrolling the page never pans the map. */
  body.embed { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  body.embed aside { display: none; }
  body.embed kbd { display: none; }
  #shield { display: none; }
  body.embed #shield { display: grid; place-items: center; position: absolute; inset: 0; cursor: pointer; background: transparent; }
  body.embed #shield span { font: 600 13px system-ui, sans-serif; background: rgba(0,0,0,0.7); color: #fff; padding: 6px 12px; border-radius: 999px; }
</style>
</head>
<body>
<aside>
  <h1>Mind the Surface</h1>
  <p class="tag">A Main Road Is Not Always Paved</p>

  <label for="spot">Sample spot</label>
  <select id="spot"></select>

  <label for="search">Search anywhere</label>
  <input id="search" type="search" placeholder="Place name, then Enter">

  <div id="style-box">
    <label for="style">Style</label>
    <select id="style"></select>
  </div>
  <div class="row"><input id="compare" type="checkbox"><label for="compare">Side by side: all styles</label></div>

  <div id="legend"></div>
  <div id="note"></div>
  <div id="status"></div>
</aside>
<main>
  <canvas id="map"></canvas>
  <div id="chips" role="group" aria-label="Style"></div>
  <div id="bgchips" class="chips" role="group" aria-label="Background"></div>
  <div id="msg"></div>
  <div id="shield"><span>Click to explore the map</span></div>
  <div id="attr">© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · Terrain: AWS Terrain Tiles</div>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
