<svg xmlns="http://www.w3.org/2000/svg" width="942" height="804" viewBox="0 0 942 804"><rect width="942" height="804" fill="#fff"/><text x="10" y="26" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">The design: minor ways (tracks and white roads) against main roads</text><text x="10" y="46" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#666" text-anchor="start">High vis 2 colours, 1.5 x widths, z15, on the proposed land. Easy = confirmed for a city car; Unpaved = not confirmed; 4WD = horrible or worse.</text><text x="375" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="middle">Paved</text><text x="533" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="middle">Easy</text><text x="691" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="middle">Unpaved</text><text x="849" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="middle">4WD</text><text x="10" y="126" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Minor ways: the mark is on the edges, then fills the middle</text><text x="10" y="142" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#666" text-anchor="start">Edges are neutral here, so they can carry the surface. More brown = rougher.</text><text x="10" y="181" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">Track</text><text x="10" y="196" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#666" text-anchor="start">a narrow road; Easy = white with brown edges</text><g transform="translate(300 152)"><rect width="150" height="58" rx="4" fill="#fbfaf6"/><path d="M10 46 C 45 8, 95 58, 140 14" fill="none" stroke="#8f8f8f" stroke-width="5.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 46 C 45 8, 95 58, 140 14" fill="none" stroke="#ffffff" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(458 152)"><rect width="150" height="58" rx="4" fill="#fbfaf6"/><path d="M10 46 C 45 8, 95 58, 140 14" fill="none" stroke="#b0773a" stroke-width="5.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 46 C 45 8, 95 58, 140 14" fill="none" stroke="#ffffff" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(616 152)"><rect width="150" height="58" rx="4" fill="#fbfaf6"/><path d="M10 46 C 45 8, 95 58, 140 14" fill="none" stroke="#b0773a" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(774 152)"><rect width="150" height="58" rx="4" fill="#fbfaf6"/><path d="M10 46 C 45 8, 95 58, 140 14" fill="none" stroke="#2b190c" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round"/></g><text x="10" y="247" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">Single track (motorcycle=yes)</text><text x="10" y="262" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#666" text-anchor="start">dashes; Easy drawn as Unpaved</text><g transform="translate(300 218)"><rect width="150" height="58" rx="4" fill="#fbfaf6"/><path d="M10 46 C 45 8, 95 58, 140 14" fill="none" stroke="#8f8f8f" stroke-width="2.625" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="10.5 4.5"/></g><g transform="translate(458 218)"><rect width="150" height="58" rx="4" fill="#fbfaf6"/><path d="M10 46 C 45 8, 95 58, 140 14" fill="none" stroke="#b0773a" stroke-width="2.625" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="10.5 4.5"/></g><g transform="translate(616 218)"><rect width="150" height="58" rx="4" fill