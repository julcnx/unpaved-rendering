<svg xmlns="http://www.w3.org/2000/svg" width="912" height="900" viewBox="0 0 912 900"><rect width="912" height="900" fill="#fff"/><text x="10" y="26" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Design v3: one system, the outline carries the condition, the fill keeps the class</text><text x="10" y="46" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#666" text-anchor="start">Paved: grey or class outline. Car friendly: slate blue. Unpaved: brown. 4WD: near black. High vis 2 widths (1.5 x), z15, proposed land.</text><text x="345" y="86" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="middle">Paved</text><text x="503" y="86" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="middle">Car friendly</text><text x="661" y="86" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="middle">Unpaved</text><text x="819" y="86" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="middle">4WD</text><text x="10" y="114" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Minor ways</text><text x="10" y="130" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#666" text-anchor="start">white fill; the outline is the condition</text><text x="10" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">Track</text><text x="10" y="183" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#666" text-anchor="start">Unpaved and 4WD solid (all outline)</text><g transform="translate(270 140)"><rect width="150" height="56" rx="4" fill="#fbfaf6"/><path d="M10 44 C 45 8, 100 56, 140 14" fill="none" stroke="#8f8f8f" stroke-width="6.7