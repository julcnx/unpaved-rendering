<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="890" viewBox="0 0 1050 890"><rect width="1050" height="890" fill="#fff"/><text x="10" y="26" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Closed track at track width: next to a paved trunk (red) and an open Unpaved track</text><text x="10" y="46" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#666" text-anchor="start">Left track: open, Unpaved. Right track: closed (motorcycle, motor_vehicle or access = no, private, agricultural, forestry).</text><text x="570" y="64" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#666" text-anchor="middle">Land</text><text x="880" y="64" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#666" text-anchor="middle">Forest</text><text x="10" y="94" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Old: thin pale red</text><text x="10" y="114" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#666" text-anchor="start">path width, #e07878: reads as a path, trunk red family</text><g transform="translate(420 70)"><rect width="300" height="150" rx="4" fill="#f2efe9"/><path d="M60 40 C 70 90, 90 120, 110 150" fill="none" stroke="#b0773a" stroke-width="5" stroke-opacity="1" stroke-linecap="butt"/><path d="M190 40 C 200 90, 220 120, 240 150" fill="none" stroke="#e07878" stroke-width="2.8" stroke-opacity="1" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#c84e2f" stroke-width="16.4" stroke-opacity="1" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#f9b29c" stroke-width="14" stroke-opacity="1" stroke-linecap="butt"/></g><g transform="translate(730 70)"><rect width="300" height="150" rx="4" fill="#dce6d0"/><path d="M60 40 C 70 90, 90 120, 110 150" fill="none" stroke="#b0773a" stroke-width="5" stroke-opacity="1" stroke-linecap="butt"/><path d="M190 40 C 200 90, 220 120, 240 150" fill="none" stroke="#e07878" stroke-width="2.8" stroke-opacity="1" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#c84e2f" stroke-width="16.4" stroke-opacity="1" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#f9b29c" stroke-width="14" stroke-opacity="1" stroke-linecap="butt"/></g><text x="10" y="254" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">A. Crimson, track width</text><text x="10" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#666" text-anchor="start">#a3245a: red meaning kept, hue away from the orange-red trunk</text><g transform="translate(420 230)"><rect width="300" height="150" rx="4" fill="#f2efe9"/><path d="M60 40 C 70 90, 90 120, 110 150" fill="none" stroke="#b0773a" stroke-width="5" stroke-opacity="1" stroke-linecap="butt"/><path d="M190 40 C 200 90, 220 120, 240 150" fill="none" stroke="#a3245a" stroke-width="5" stroke-opacity="1" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#c84e2f" stroke-width="16.4" stroke-opacity="1" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#f9b29c" stroke-width="14" stroke-opacity="1" stroke-linecap="butt"/></g><g transform="translate(730 230)"><rect width="300" height="150" rx="4" fill="#dce6d0"/><path d="M60 40 C 70 90, 90 120, 110 150" fill="none" stroke="#b0773a" stroke-width="5" stroke-opacity="1" stroke-linecap="butt"/><path d="M190 40 C 200 90, 220 120, 240 150" fill="none" stroke="#a3245a" stroke-width="5" stroke-opacity="1" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#c84e2f" stroke-width="16.4" stroke-opacity="1" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#f9b29c" stroke-width="14" stroke-opacity="1" stroke-linecap="butt"/></g><text x="10" y="414" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">B. Track colour, red outline</text><text x="10" y="434" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#666" text-anchor="start">surface still shown; thin crimson edges say closed</text><g transform="translate(420 390)"><rect width="300" height="150" rx="4" fill="#f2efe9"/><path d="M60 40 C 70 90, 90 120, 110 150" fill="none" stroke="#b0773a" stroke-width="5" stroke-opacity="1" stroke-linecap="butt"/><path d="M190 40 C 200 90, 220 120, 240 150" fill="none" stroke="#a3245a" stroke-width="9" stroke-opacity="1" stroke-linecap="butt"/><path d="M190 40 C 200 90, 220 120, 240 150" fill="none" stroke="#b0773a" stroke-width="4.2" stroke-opacity="1" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#c84e2f" stroke-width="16.4" stroke-opacity="1" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#f9b29c" stroke-width="14" stroke-opacity="1" stroke-linecap="butt"/></g><g transform="translate(730 390)"><rect width="300" height="150" rx="4" fill="#dce6d0"/><path d="M60 40 C 70 90, 90 120, 110 150" fill="none" stroke="#b0773a" stroke-width="5" stroke-opacity="1" stroke-linecap="butt"/><path d="M190 40 C 200 90, 220 120, 240 150" fill="none" stroke="#a3245a" stroke-width="9" stroke-opacity="1" stroke-linecap="butt"/><path d="M190 40 C 200 90, 220 120, 240 150" fill="none" stroke="#b0773a" stroke-width="4.2" stroke-opacity="1" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#c84e2f" stroke-width="16.4" stroke-opacity="1" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#f9b29c" stroke-width="14" stroke-opacity="1" stroke-linecap="butt"/></g><text x="10" y="574" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">C. Faded track, red outline</text><text x="10" y="594" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#666" text-anchor="start">as B, the track at 40%: recedes, still red-edged</text><g transform="translate(420 550)"><rect width="300" height="150" rx="4" fill="#f2efe9"/><path d="M60 40 C 70 90, 90 120, 110 150" fill="none" stroke="#b0773a" stroke-width="5" stroke-opacity="1" stroke-linecap="butt"/><path d="M190 40 C 200 90, 220 120, 240 150" fill="none" stroke="#a3245a" stroke-width="9" stroke-opacity="1" stroke-linecap="butt"/><path d="M190 40 C 200 90, 220 120, 240 150" fill="none" stroke="#f2efe9" stroke-width="4.2" stroke-opacity="1" stroke-linecap="butt"/><path d="M190 40 C 200 90, 220 120, 240 150" fill="none" stroke="#b0773a" stroke-width="4.2" stroke-opacity="0.4" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#c84e2f" stroke-width="16.4" stroke-opacity="1" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#f9b29c" stroke-width="14" stroke-opacity="1" stroke-linecap="butt"/></g><g transform="translate(730 550)"><rect width="300" height="150" rx="4" fill="#dce6d0"/><path d="M60 40 C 70 90, 90 120, 110 150" fill="none" stroke="#b0773a" stroke-width="5" stroke-opacity="1" stroke-linecap="butt"/><path d="M190 40 C 200 90, 220 120, 240 150" fill="none" stroke="#a3245a" stroke-width="9" stroke-opacity="1" stroke-linecap="butt"/><path d="M190 40 C 200 90, 220 120, 240 150" fill="none" stroke="#dce6d0" stroke-width="4.2" stroke-opacity="1" stroke-linecap="butt"/><path d="M190 40 C 200 90, 220 120, 240 150" fill="none" stroke="#b0773a" stroke-width="4.2" stroke-opacity="0.4" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#c84e2f" stroke-width="16.4" stroke-opacity="1" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#f9b29c" stroke-width="14" stroke-opacity="1" stroke-linecap="butt"/></g><text x="10" y="734" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">D. Grey solid, track width</text><text x="10" y="754" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#666" text-anchor="start">#8c8c8c: "not for you", no red at all; close to the paved-track casing</text><g transform="translate(420 710)"><rect width="300" height="150" rx="4" fill="#f2efe9"/><path d="M60 40 C 70 90, 90 120, 110 150" fill="none" stroke="#b0773a" stroke-width="5" stroke-opacity="1" stroke-linecap="butt"/><path d="M190 40 C 200 90, 220 120, 240 150" fill="none" stroke="#8c8c8c" stroke-width="5" stroke-opacity="1" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#c84e2f" stroke-width="16.4" stroke-opacity="1" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#f9b29c" stroke-width="14" stroke-opacity="1" stroke-linecap="butt"/></g><g transform="translate(730 710)"><rect width="300" height="150" rx="4" fill="#dce6d0"/><path d="M60 40 C 70 90, 90 120, 110 150" fill="none" stroke="#b0773a" stroke-width="5" stroke-opacity="1" stroke-linecap="butt"/><path d="M190 40 C 200 90, 220 120, 240 150" fill="none" stroke="#8c8c8c" stroke-width="5" stroke-opacity="1" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#c84e2f" stroke-width="16.4" stroke-opacity="1" stroke-linecap="butt"/><path d="M0 40 L300 40" fill="none" stroke="#f9b29c" stroke-width="14" stroke-opacity="1" stroke-linecap="butt"/></g></svg>